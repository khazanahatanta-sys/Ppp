        // --- Web Audio API Synthesizer ---
        const SoundEngine = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            },
            play(type) {
                const settings = AppState.settings;
                if (!settings.soundEnabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    if (type === 'click') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(400, now);
                        osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                        gain.gain.setValueAtTime(settings.volume * 0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                        osc.start(now);
                        osc.stop(now + 0.05);
                    } else if (type === 'success') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(523.25, now); // C5
                        osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                        osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                        gain.gain.setValueAtTime(settings.volume * 0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                    } else if (type === 'fusion') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(900, now + 0.4);
                        gain.gain.setValueAtTime(settings.volume * 0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                        osc.start(now);
                        osc.stop(now + 0.4);
                    } else if (type === 'delete') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(220, now);
                        osc.frequency.exponentialRampToValueAtTime(110, now + 0.2);
                        gain.gain.setValueAtTime(settings.volume * 0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                        osc.start(now);
                        osc.stop(now + 0.2);
                    } else if (type === 'notify') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.setValueAtTime(800, now + 0.1);
                        gain.gain.setValueAtTime(settings.volume * 0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                        osc.start(now);
                        osc.stop(now + 0.2);
                    }
                } catch (e) {
                    console.error('Audio playback error:', e);
                }
            }
        };

        function generateIdeas() {
            SoundEngine.play('success');
            const cat = document.getElementById('gen-category')?.value || 'Semua';
            const target = document.getElementById('gen-target')?.value || 'Semua';
            const diff = document.getElementById('gen-difficulty')?.value || 'Semua';
            const count = parseInt(document.getElementById('gen-count')?.value || '3');

            let pool = [...IdeaTemplates];
            if (cat !== 'Semua') pool = pool.filter(p => p.category === cat);
            if (target !== 'Semua') pool = pool.filter(p => p.target === target);
            if (diff !== 'Semua') pool = pool.filter(p => p.difficulty === diff);

        function initCanvasEvents() {
            renderCanvasLines();
            // Drag and drop for canvas nodes
            const container = document.getElementById('canvas-workspace');
            if (!container) return;

            let activeCard = null;
            let startX = 0, startY = 0;
            let initialX = 0, initialY = 0;

            document.querySelectorAll('.canvas-card').forEach(card => {
                card.addEventListener('mousedown', (e) => {
                    if (e.target.closest('button')) return;
                    activeCard = card;
                    startX = e.clientX;
                    startY = e.clientY;
                    initialX = parseInt(card.style.left) || 0;
                    initialY = parseInt(card.style.top) || 0;
                    card.style.zIndex = 100;
                });

                // Touch support
                card.addEventListener('touchstart', (e) => {
                    if (e.target.closest('button')) return;
                    activeCard = card;
                    const touch = e.touches[0];
                    startX = touch.clientX;
                    startY = touch.clientY;
                    initialX = parseInt(card.style.left) || 0;
                    initialY = parseInt(card.style.top) || 0;
                    card.style.zIndex = 100;
                }, {passive: true});
            });

            window.addEventListener('mousemove', (e) => {
                if (!activeCard) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                const newX = Math.max(10, initialX + dx);
                const newY = Math.max(10, initialY + dy);
                activeCard.style.left = newX + 'px';
                activeCard.style.top = newY + 'px';

                // Update node state
                const id = activeCard.dataset.id;
                const node = AppState.canvasNodes.find(n => n.id === id);
                if (node) {
                    node.x = newX;
                    node.y = newY;
                }
                renderCanvasLines();
            });

            window.addEventListener('touchmove', (e) => {
                if (!activeCard) return;
                const touch = e.touches[0];
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                const newX = Math.max(10, initialX + dx);
                const newY = Math.max(10, initialY + dy);
                activeCard.style.left = newX + 'px';
                activeCard.style.top = newY + 'px';

                const id = activeCard.dataset.id;
                const node = AppState.canvasNodes.find(n => n.id === id);
                if (node) {
                    node.x = newX;
                    node.y = newY;
                }
                renderCanvasLines();
            }, {passive: true});

            window.addEventListener('mouseup', () => {
                if (activeCard) {
                    activeCard.style.zIndex = 10;
                    activeCard = null;
                    saveState();
                }
            });

            window.addEventListener('touchend', () => {
                if (activeCard) {
                    activeCard.style.zIndex = 10;
                    activeCard = null;
                    saveState();
                }
            });
        }

        function renderCanvasLines() {
            const svg = document.getElementById('canvas-svg');
            if (!svg) return;
            svg.innerHTML = '';

            // Draw connecting lines between sequential nodes
            for (let i = 0; i < AppState.canvasNodes.length - 1; i++) {
                const n1 = AppState.canvasNodes[i];
                const n2 = AppState.canvasNodes[i+1];
                const x1 = n1.x + 144; // center of card width (288/2)
                const y1 = n1.y + 60;
                const x2 = n2.x + 144;
                const y2 = n2.y + 60;

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const d = `M ${x1} ${y1} C ${x1 + 50} ${y1}, ${x2 - 50} ${y2}, ${x2} ${y2}`;
                line.setAttribute('d', d);
                line.setAttribute('stroke', '#22c55e');
                line.setAttribute('stroke-width', '2');
                line.setAttribute('stroke-dasharray', '4');
                line.setAttribute('fill', 'none');
                line.setAttribute('opacity', '0.6');
                svg.appendChild(line);
            }
        }

        function copyPromptText() {
            SoundEngine.play('success');

            const text = `Bertindaklah sebagai senior frontend developer...`; // exact text
            const outputBox = document.getElementById('prompt-output-box');
            if (outputBox) {
                const textarea = document.createElement('textarea');
                textarea.value = outputBox.innerText;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('Prompt berhasil disalin ke clipboard!');
                } catch (err) {
                    showToast('Gagal menyalin prompt', 'error');
                }
                document.body.removeChild(textarea);
            }

        function downloadPromptTXT() {
            SoundEngine.play('success');
            const outputBox = document.getElementById('prompt-output-box');
            if (!outputBox) return;
            const blob = new Blob([outputBox.innerText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Prompt_${AppState.promptState.projectName || 'IdeaForge'}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('File TXT prompt berhasil diunduh!');
        }

        function initCollectionEvents() {}

        function filterCollection() {
            const query = document.getElementById('collection-search')?.value.toLowerCase() || '';
            const cat = document.getElementById('collection-filter-cat')?.value || 'Semua';
            const sort = document.getElementById('collection-sort')?.value || 'latest';

            let list = [...AppState.projects];
            if (query) {
                list = list.filter(p => p.name.toLowerCase().includes(query) || p.tagline.toLowerCase().includes(query));
            }
            if (cat !== 'Semua') {
                list = list.filter(p => p.category === cat);
            }
            list.sort((a,b) => {
                const da = new Date(a.createdAt || 0);
                const db = new Date(b.createdAt || 0);
                return sort === 'latest' ? db - da : da - db;
            });

            const grid = document.getElementById('collection-grid');
            if (grid) grid.innerHTML = renderCollectionCards(list);
        }

        function toggleFavorite(id) {
            SoundEngine.play('click');
            if (AppState.favorites.includes(id)) {
                AppState.favorites = AppState.favorites.filter(f => f !== id);
                showToast('Dihapus dari favorit');
            } else {
                AppState.favorites.push(id);
                showToast('Ditambahkan ke favorit!');
            }
            saveState();
            filterCollection();
        }

        function duplicateProject(id) {
            SoundEngine.play('success');
            const target = AppState.projects.find(p => p.id === id);
            if (!target) return;
            const copy = {
                ...target,
                id: 'proj_' + Date.now(),
                name: target.name + ' (Salinan)',
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            AppState.projects.push(copy);
            saveState();
            filterCollection();
            showToast('Proyek berhasil diduplikasi!');
        }

        function deleteProject(id) {
            SoundEngine.play('delete');
            AppState.projects = AppState.projects.filter(p => p.id !== id);
            AppState.favorites = AppState.favorites.filter(f => f !== id);
            saveState();
            filterCollection();
            showToast('Proyek dihapus.');
        }

        function openProjectModal(id) {
            const p = AppState.projects.find(proj => proj.id === id);
            if (!p) return;
            openModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <span class="px-2.5 py-1 rounded-md text-xs font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300">${p.category}</span>

                        <p class="text-xs font-semibold text-gray-500">Fitur Utama:</p>
                        <div class="flex flex-wrap gap-1">

                        <p class="text-xs font-semibold text-gray-500">Rekomendasi Teknologi:</p>
                        <p class="text-xs font-mono text-gray-600 dark:text-gray-300">${p.tech || 'Standard Web Stack'}</p>
                    </div>

                    <div class="flex justify-end gap-2 pt-4 border-t border-gray-100 dark:border-gray-800">
                        <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 text-xs font-medium">Tutup</button>
                        <button onclick='sendToPrompt(${JSON.stringify(p).replace(/'/g, "&apos;")}); closeModal();' class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium">Buat Prompt dari Ini</button>
                    </div>
                </div>
            `);
        }

        // Export/Import JSON
        function exportDataJSON() {
            SoundEngine.play('success');
            const data = {
                projects: AppState.projects,
                favorites: AppState.favorites,
                canvasNodes: AppState.canvasNodes,
                settings: AppState.settings,
                version: '1.0',
                exportedAt: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `IdeaForge_Backup_${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Data berhasil diekspor ke JSON!');
        }

        function importDataJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const parsed = JSON.parse(event.target.result);
                    if (parsed.projects && Array.isArray(parsed.projects)) {
                        AppState.projects = parsed.projects;
                        if (parsed.favorites) AppState.favorites = parsed.favorites;
                        if (parsed.canvasNodes) AppState.canvasNodes = parsed.canvasNodes;
                        if (parsed.settings) AppState.settings = parsed.settings;
                        saveState();
                        applyTheme();
                        renderView();
                        SoundEngine.play('success');
                        showToast('Data berhasil diimpor!');
                    } else {
                        showToast('Format file JSON tidak valid.', 'error');
                    }
                } catch (err) {
                    showToast('Gagal memparsing file JSON.', 'error');
                }
            };
            reader.readAsText(file);
        }

                                ${s.soundEnabled ? 'Aktif' : 'Nonaktif'}

                            <div class="flex items-center justify-between">
                                <h3 class="font-bold text-sm">Volume Suara</h3>
                                <span class="text-xs text-gray-500">${Math.round(s.volume * 100)}%</span>

                                <h3 class="font-bold text-sm text-red-600">Hapus Semua Data</h3>

                    <div class="text-center text-xs text-gray-400">
                        <p>IdeaForge v1.0 — Berjalan sepenuhnya secara lokal di perangkat Anda melalui LocalStorage.</p>

            `;
        }

        function initSettingsEvents() {}

        function toggleDarkMode() {
            SoundEngine.play('click');
            AppState.settings.theme = AppState.settings.theme === 'dark' ? 'light' : 'dark';
            saveState();
            applyTheme();
            renderView();
        }

        function applyTheme() {
            if (AppState.settings.theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            const soundIcon = document.getElementById('sound-icon');
            if (soundIcon) {
                soundIcon.innerHTML = AppState.settings.soundEnabled 
                    ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>'
                    : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>';
            }
        }

        function toggleSound() {
            AppState.settings.soundEnabled = !AppState.settings.soundEnabled;
            saveState();
            SoundEngine.play('click');
            applyTheme();
            renderView();
            showToast(AppState.settings.soundEnabled ? 'Efek suara diaktifkan' : 'Efek suara dinonaktifkan');
        }

        function updateVolume(val) {
            AppState.settings.volume = parseFloat(val);
            saveState();
        }

        function confirmResetData() {
            openModal(`
                <div class="space-y-4">
                    <h3 class="font-bold text-lg text-red-600">Konfirmasi Reset Data</h3>
                    <p class="text-sm text-gray-600 dark:text-gray-300">Apakah Anda yakin ingin menghapus seluruh data proyek dan papan ide? Tindakan ini tidak dapat dibatalkan.</p>
                    <div class="flex justify-end gap-2 pt-2">
                        <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 text-xs font-medium">Batal</button>
                        <button onclick="executeResetData()" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-medium">Ya, Hapus Semua</button>
                    </div>
                </div>
            `);
        }

        function executeResetData() {
            SoundEngine.play('delete');
            localStorage.removeItem('ideaforge_state_v1');
            AppState.projects = [];
            AppState.favorites = [];
            AppState.canvasNodes = [];
            closeModal();
            router.navigate('home');
            showToast('Semua data berhasil direset.');
        }

        // --- Utility Modals & Toasts ---
        function openModal(html) {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            if (!container || !content) return;
            content.innerHTML = html;
            container.classList.remove('hidden');
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            if (container) container.classList.add('hidden');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-xs font-medium flex items-center gap-2 transform translate-y-2 opacity-0 transition-all duration-300 ${
                type === 'error' 
                    ? 'bg-red-50 text-red-800 border-red-200 dark:bg-red-950 dark:text-red-300 dark:border-red-800' 
                    : 'bg-white text-gray-900 border-gray-200 dark:bg-gray-900 dark:text-gray-100 dark:border-gray-800'
            }`;
            toast.innerHTML = `
                <svg class="w-4 h-4 ${type === 'error' ? 'text-red-500' : 'text-emerald-500'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                ${message}
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            router.navigate('home');

            // Mobile sidebar toggle
            document.getElementById('open-sidebar')?.addEventListener('click', () => {
                document.getElementById('sidebar')?.classList.remove('-translate-x-full');
            });
            document.getElementById('close-sidebar')?.addEventListener('click', () => {
                document.getElementById('sidebar')?.classList.add('-translate-x-full');
            });
        });
    </script>
</body>
</html>
